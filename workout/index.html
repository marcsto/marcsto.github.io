<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Workout Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
    <script type="module" src="fullscreen.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <span class="kicker">Workout</span>
          <h1>Tracker</h1>
        </div>
        <div class="sync-block">
          <a class="icon-text-button compact-link" href="calendar.html">
            <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
            <span>History</span>
          </a>
          <a class="icon-text-button compact-link" href="progress.html">
            <span class="material-symbols-rounded" aria-hidden="true">monitoring</span>
            <span>Progress</span>
          </a>
          <button id="fullscreenButton" class="icon-text-button compact-link fullscreen-button" type="button">
            <span class="material-symbols-rounded fullscreen-icon" aria-hidden="true">fullscreen</span>
            <span class="fullscreen-label">Full</span>
          </button>
          <span id="syncStatus" class="sync-status" aria-live="polite">Local</span>
          <button id="signInButton" class="icon-text-button" type="button">
            <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
            <span>Sign in</span>
          </button>
        </div>
      </header>

      <main class="main-stage">
        <section id="homeView" class="view view-active" aria-labelledby="homeHeading">
          <h2 id="homeHeading" class="visually-hidden">Exercises</h2>
          <div id="exerciseGrid" class="exercise-grid"></div>
        </section>

        <section id="entryView" class="view entry-view" aria-labelledby="exerciseTitle" hidden>
          <div class="entry-header">
            <button id="backButton" class="back-button" type="button">
              <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
              <span>Back</span>
            </button>
            <div class="exercise-heading">
              <h2 id="exerciseTitle"></h2>
              <span id="lastLogged" class="last-logged"></span>
            </div>
          </div>

          <div class="entry-controls">
            <button id="saveButton" class="save-button" type="button">
              <span class="material-symbols-rounded" aria-hidden="true">check_circle</span>
              <span>Save</span>
            </button>

            <div class="metric-control">
              <button id="repsDown" class="step-button" type="button">-1</button>
              <label class="slider-block" for="repsSlider">
                <span class="metric-label">
                  <span id="repsLabel">Reps</span>
                  <output id="repsValue" for="repsSlider">8</output>
                </span>
                <input id="repsSlider" type="range" min="1" max="30" step="1" value="8">
              </label>
              <button id="repsUp" class="step-button" type="button">+1</button>
            </div>

            <div id="weightControl" class="metric-control">
              <button id="weightDown" class="step-button wide-step" type="button">-2.5 lbs</button>
              <label class="slider-block" for="weightSlider">
                <span class="metric-label">
                  <span id="weightLabel">Weight</span>
                  <output id="weightValue" for="weightSlider">0 lb</output>
                </span>
                <input id="weightSlider" type="range" min="0" max="500" step="2.5" value="0">
              </label>
              <button id="weightUp" class="step-button wide-step" type="button">+2.5 lbs</button>
            </div>

            <div id="entryStatus" class="entry-status" aria-live="polite"></div>

            <section class="recent-sets" aria-labelledby="recentSetsHeading">
              <div class="recent-sets-header">
                <h3 id="recentSetsHeading">Recent sets</h3>
              </div>
              <div id="recentSetList" class="recent-set-list"></div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
