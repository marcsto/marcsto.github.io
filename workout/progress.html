<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Workout Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" defer></script>
    <script type="module" src="progress.js"></script>
  </head>
  <body>
    <div class="app-shell progress-shell">
      <header class="topbar">
        <div class="title-block">
          <span class="kicker">Workout</span>
          <h1>Progress</h1>
        </div>
        <div class="sync-block">
          <a class="icon-text-button compact-link" href="index.html">
            <span class="material-symbols-rounded" aria-hidden="true">add_circle</span>
            <span>Log</span>
          </a>
          <a class="icon-text-button compact-link" href="calendar.html">
            <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
            <span>History</span>
          </a>
          <span id="progressStatus" class="sync-status" aria-live="polite">Loading</span>
          <button id="signInButton" class="icon-text-button" type="button">
            <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
            <span>Sync</span>
          </button>
        </div>
      </header>

      <main class="main-stage progress-stage">
        <section class="progress-panel" aria-labelledby="progressHeading">
          <div class="progress-controls">
            <label class="exercise-select-label" for="exerciseSelect">
              <span id="progressHeading">Exercise</span>
              <select id="exerciseSelect"></select>
            </label>
            <button id="refreshButton" class="icon-text-button refresh-button" type="button">
              <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
              <span>Refresh</span>
            </button>
          </div>

          <div id="chartMessage" class="chart-message" aria-live="polite"></div>
          <div class="chart-container">
            <canvas id="progressChart" aria-label="Workout progress chart"></canvas>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
